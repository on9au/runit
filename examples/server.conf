# Sample config for `cargo run --example config_check`.
# It has a few deliberate mistakes; fix them and run again.

host = api.example.com
port = 22
workers = 8
log_level = verbose
timeout_ms = 30000
max_body_kb = 512

allowed_origins = https://example.com, http://localhost:3000

[tls]
enabled = true
cert = /etc/ssl/server.crt
key = /etc/ssl/server.pem
